# Inside the existing WordTap server block, after root, before other rewrites.
# Upload the generated file to this non-public configuration directory first.
include /www/server/panel/vhost/rewrite/wordtap-lesson-redirects.conf;

# Keep the original request check during error_page internal redirects as well.
set $wordtap_https_redirect $scheme;
if ($request_uri ~ "^/\.well-known/acme-challenge/") {
    set $wordtap_https_redirect "challenge";
}
if ($wordtap_https_redirect = http) {
    return 301 https://wordtap.cn$request_uri;
}
