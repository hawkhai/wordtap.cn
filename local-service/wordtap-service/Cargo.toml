[package]
name = "wordtap-service"
version = "0.2.2"
edition = "2021"

[dependencies]
axum = "0.7"
base64 = "0.22"
chrono = "0.4"
dirs = "5"
futures-util = "0.3"
hex = "0.4"
http = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
winresource = "0.1"
